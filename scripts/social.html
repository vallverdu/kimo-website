<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kimo social image source · 1200 × 630</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    @font-face { font-family: 'Roboto Mono'; font-weight: 300; src: url('../assets/fonts/roboto-mono-light.ttf'); }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--color-background); color: var(--color-ink); font: 300 16px/1.7 var(--font-family); }
    main { position: relative; height: 100%; padding: 44px 58px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 34px; }
    .brand img { width: 44px; height: 44px; }
    .dot, .accent { color: var(--color-accent); }
    h1 { font-size: 58px; font-weight: 300; line-height: 1.2; letter-spacing: -3px; margin: 44px 0 22px; }
    p { color: var(--color-text); font-size: 16px; width: 560px; }
    .stage { position: absolute; right: 48px; top: 44px; width: 420px; height: 494px; border: 1px solid var(--color-line); background: var(--color-surface); }
    .stage > span { position: absolute; top: 15px; left: 18px; font-size: 10px; color: var(--color-muted); }
    .phone { position: absolute; width: 170px; padding: 4px; border: 1px solid var(--color-ink); border-radius: 12px; background: var(--color-background); }
    .phone img { width: 100%; display: block; border-radius: 8px; }
    .one { left: 24px; top: 57px; }
    .two { right: 24px; top: 100px; }
    footer { position: absolute; bottom: 35px; left: 58px; right: 48px; border-top: 1px solid var(--color-line); padding-top: 18px; display: flex; justify-content: space-between; color: var(--color-muted); font-size: 11px; letter-spacing: 1px; }
  </style>
</head>
<body><main>
  <div class="brand"><img src="../assets/brand/kimo-light.svg" alt=""><span>kimo<span class="dot">.</span></span></div>
  <h1>Your computer.<br>Your agents.<br><span class="accent">In your pocket.</span></h1>
  <p>Create projects and direct Claude Code or Codex<br>on your own machines. From your phone.</p>
  <div class="stage"><span>YOUR PHONE → YOUR COMPUTER</span><div class="phone one"><img src="../assets/screenshots/phone-projects.png" alt=""></div><div class="phone two"><img src="../assets/screenshots/phone-terminal.png" alt=""></div></div>
  <footer><span>MOBILE-FIRST AGENT DEVELOPMENT · BUILT IN RUST</span><span>macOS + Linux · Open source</span></footer>
</main></body>
</html>
